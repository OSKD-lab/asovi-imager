[project]
name = "asovi-imager"
version = "0.1.0"
description = "Wide-field cortical imaging (WFCI) analysis pipeline: registration, linear subtraction (dF/F), PCA/ICA denoising, Allen CCFv3 atlas registration, and ROI signal extraction"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Ryosuke Takeuchi" },
    { name = "Akinori Y Sato" },
]
keywords = [
    "neuroscience", "widefield imaging", "calcium imaging", "mesoscale imaging",
    "image registration", "Allen CCF", "ICA", "NWB",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
license = "MIT"
# Both, not just LICENSE: the DFT registration is a close port of BSD-licensed
# MATLAB, and BSD asks that a binary distribution reproduce the notice in the
# material shipped with it.  These land in `<dist-info>/licenses/`.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "dearpygui>=2.2",
    "h5py>=3.16.0",
    "hdf5plugin>=5.0.0",
    "matplotlib>=3.10.8",
    "natsort>=8.4.0",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.1",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sif-parser>=0.3.6",
    "tifffile>=2026.3.3",
    "torch>=2.6.0",
    "tqdm>=4.67.3",
]

[project.urls]
Homepage = "https://github.com/OSKD-lab/asovi-imager"
Repository = "https://github.com/OSKD-lab/asovi-imager"
Issues = "https://github.com/OSKD-lab/asovi-imager/issues"
"Getting started" = "https://github.com/OSKD-lab/asovi-imager/blob/main/docs/getting_started.md"

# Every one of these is imported lazily, at the point of use -- `import asvimg`
# pulls in none of them -- so a base install is the pipeline, and you add what you
# actually run.  dearpygui stays required: the GUI is the documented main path and
# cpselect needs it, and it is not what makes an install big (torch is).
[project.optional-dependencies]
nwb = [
    "pynwb>=4.0",  # NWB writer for asovi-nwb (code targets the 4.0 API: create_device(model_name=), add_column-after-rows)
    "nwbinspector>=0.6",  # NWB export validation (nwbinspector --config dandi)
]
atlas = ["pynrrd>=1.1"]  # read Allen CCF .nrrd volumes in the atlas builder
nd2 = ["nd2>=0.10"]  # read Nikon .nd2 recordings (asvimg.nd2rec)
notebook = ["jupyter>=1.1.1", "ipykernel>=7.2.0"]  # nothing imports these; they run the notebooks
# The Numba registrator is a benchmark reference only: ~175 ms/frame against the
# production torch DftRegistrator's ~12 at the same settings, and nothing but
# tests/benchmark_dft_compare.py imports it.
benchmark = ["numba>=0.64.0"]
all = ["asovi-imager[nwb,atlas,nd2,notebook,benchmark]"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    # every extra, so a plain `uv sync` still gives a complete development
    # environment.  The extras exist to slim down what a user installs, not to
    # strip the maintainer's checkout: the suite exercises the NWB export and the
    # atlas builder, and the notebooks need jupyter.
    "asovi-imager[all]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src-layout: the single distributed package is `asvimg`, and everything under it
# ships -- including gui/assets/*.ico|png and presets/*.yaml, which the code
# reaches through `Path(__file__).parent`, so they must be inside the package.
# tests/ and notebooks/ deliberately stay out of the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/asvimg"]

[tool.hatch.build.targets.sdist]
include = ["src/asvimg", "tests", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
asovi-preprocess = "asvimg.preprocess:main"
asovi-pipeline01 = "asvimg.preprocess:main"  # deprecated alias
asovi-run = "asvimg.run_pipeline:main"  # full headless pipeline
asovi-gui = "asvimg.gui:launch"  # dearpygui dashboard
asovi-demux = "asvimg.gui.demux_editor:main"  # standalone demux-correction editor
asovi-nwb = "asvimg.gui.nwb_editor:main"  # standalone NWB builder (metadata + export)
asovi-atlas = "asvimg.atlas_build:main"  # build a top-view CCF atlas from the annotation volume
asovi-atlas-gui = "asvimg.gui.atlas_editor:main"  # GUI to build a 2D atlas with adjustable tilt
asovi-sifx2tiff = "asvimg.sifx_convert:main"  # .sifx spool -> stacked TIFF
